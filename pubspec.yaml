name: mpos_beat
description: "A new Flutter project."

publish_to: "none"

version: 1.0.1+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dropdown_alert: ^1.0.7
  provider: ^6.1.2
  injectable: ^2.5.0
  freezed_annotation: ^3.1.0
  equatable: ^2.0.7
  get_it: ^9.0.5
  shared_preferences: ^2.3.4
  connectivity_plus: ^7.0.0
  pretty_dio_logger: ^1.4.0
  intl:
  flutter_spinkit: ^5.2.1
  smooth_page_indicator: ^1.2.1
  flutter_svg: ^2.2.0
  pinput: ^6.0.0
  avatar_glow:
  lottie: ^3.3.1
  go_router:
  encrypt: ^5.0.3
  http: ^1.5.0
  fpdart: ^1.1.1
  collection: ^1.19.1
  # google_fonts: ^6.3.2
  popover: ^0.4.0
  drift: 
  sqlite3: ^2.9.3
  path_provider: ^2.1.5
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.5.40
  rxdart: ^0.28.0
  shimmer: ^3.0.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  injectable_generator: ^2.6.2
  drift_dev: 
  build_runner: ^2.4.13
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/svgs/
    - assets/images/pngs/
    - assets/images/animations/

  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/raleway/Raleway-Regular.ttf
        - asset: assets/fonts/raleway/Raleway-Medium.ttf
        - asset: assets/fonts/raleway/Raleway-SemiBold.ttf
        - asset: assets/fonts/raleway/Raleway-Bold.ttf
        - asset: assets/fonts/raleway/Raleway-ExtraBold.ttf
        - asset: assets/fonts/raleway/Raleway-Black.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
        - asset: assets/fonts/roboto/Roboto-SemiBold.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
        - asset: assets/fonts/roboto/Roboto-ExtraBold.ttf
        - asset: assets/fonts/roboto/Roboto-Black.ttf

    - family: Gilroy
      fonts:
        - asset: assets/fonts/gilroy/Gilroy-Regular.ttf
        - asset: assets/fonts/gilroy/Gilroy-Medium.ttf
        - asset: assets/fonts/gilroy/Gilroy-SemiBold.ttf
        - asset: assets/fonts/gilroy/Gilroy-Bold.ttf
        - asset: assets/fonts/gilroy/Gilroy-ExtraBold.ttf
        - asset: assets/fonts/gilroy/Gilroy-Black.ttf
